schema: paperclip/v1
agents:
  cto:
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 300
    adapter:
      type: opencode_local
      config:
        model: deepseek/deepseek-v4-flash-0731
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
            value: >-
              {"deepseek":{"npm":"@ai-sdk/openai-compatible","name":"OpenRouter DeepSeek","options":{"baseURL":"https://openrouter.ai/api/v1","apiKey":"{env:OPENROUTER_API_KEY}"},"models":{"deepseek-v4-flash-0731":{"id":"deepseek/deepseek-v4-flash-0731"}}}}
          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-flash-0731
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
        GH_TOKEN:
          kind: secret
          requirement: optional
  problem-gatherer:
    adapter:
      type: opencode_local
      config:
        model: deepseek/deepseek-v4-flash-0731
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
            value: >-
              {"deepseek":{"npm":"@ai-sdk/openai-compatible","name":"OpenRouter DeepSeek","options":{"baseURL":"https://openrouter.ai/api/v1","apiKey":"{env:OPENROUTER_API_KEY}"},"models":{"deepseek-v4-flash-0731":{"id":"deepseek/deepseek-v4-flash-0731"}}}}
          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-flash-0731
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
        AOC_SESSION:
          kind: secret
          requirement: optional
  problem-solver:
    adapter:
      type: opencode_local
      config:
        model: deepseek/deepseek-v4-pro-0813
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
            value: >-
              {"deepseek":{"npm":"@ai-sdk/openai-compatible","name":"OpenRouter DeepSeek","options":{"baseURL":"https://openrouter.ai/api/v1","apiKey":"{env:OPENROUTER_API_KEY}"},"models":{"deepseek-v4-pro-0813":{"id":"deepseek/deepseek-v4-pro-0813"}}}}
          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-pro-0813
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
        GH_TOKEN:
          kind: secret
          requirement: optional
  problem-submitter:
    adapter:
      type: opencode_local
      config:
        model: deepseek/deepseek-v4-flash-0731
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
            value: >-
              {"deepseek":{"npm":"@ai-sdk/openai-compatible","name":"OpenRouter DeepSeek","options":{"baseURL":"https://openrouter.ai/api/v1","apiKey":"{env:OPENROUTER_API_KEY}"},"models":{"deepseek-v4-flash-0731":{"id":"deepseek/deepseek-v4-flash-0731"}}}}
          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-flash-0731
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
        AOC_SESSION:
          kind: secret
          requirement: optional
  solution-reviewer:
    adapter:
      type: opencode_local
      config:
        model: deepseek/deepseek-v4-flash-0731
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
            value: >-
              {"deepseek":{"npm":"@ai-sdk/openai-compatible","name":"OpenRouter DeepSeek","options":{"baseURL":"https://openrouter.ai/api/v1","apiKey":"{env:OPENROUTER_API_KEY}"},"models":{"deepseek-v4-flash-0731":{"id":"deepseek/deepseek-v4-flash-0731"}}}}
          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-flash-0731
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
  watchdog:
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 600
        maxConcurrentRuns: 1
        wakeOnDemand: false
        wakeOnAssignment: false
        wakeOnOnDemand: false
        wakeOnAutomation: false
    adapter:
      type: opencode_local
      config:
        model: deepseek/deepseek-v4-flash-0731
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
            value: >-
              {"deepseek":{"npm":"@ai-sdk/openai-compatible","name":"OpenRouter DeepSeek","options":{"baseURL":"https://openrouter.ai/api/v1","apiKey":"{env:OPENROUTER_API_KEY}"},"models":{"deepseek-v4-flash-0731":{"id":"deepseek/deepseek-v4-flash-0731"}}}}
          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-flash-0731
        timeoutSec: 120
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
  model-tester:
    adapter:
      type: opencode_local
      config:
        model: deepseek/deepseek-v4-flash-0731
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
