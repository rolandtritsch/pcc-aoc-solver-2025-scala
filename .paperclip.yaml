schema: paperclip/v1
agents:
  cto:
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 300
    adapter:
      type: opencode_local
      config:
        model: openrouter/openrouter/auto
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
  problem-gatherer:
    adapter:
      type: opencode_local
      config:
        model: openrouter/openrouter/auto
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
        AOC_SESSION:
          kind: secret
          requirement: optional
  problem-solver:
    adapter:
      type: opencode_local
      config:
        model: openrouter/openrouter/auto
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
        GH_TOKEN:
          kind: secret
          requirement: optional
  problem-submitter:
    adapter:
      type: opencode_local
      config:
        model: openrouter/openrouter/auto
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
        AOC_SESSION:
          kind: secret
          requirement: optional
  solution-reviewer:
    adapter:
      type: opencode_local
      config:
        model: openrouter/openrouter/auto
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
  watchdog:
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 600
        maxConcurrentRuns: 1
        wakeOnDemand: false
        wakeOnAssignment: false
        wakeOnOnDemand: false
        wakeOnAutomation: false
    adapter:
      type: opencode_local
      config:
        model: openrouter/openrouter/auto
        timeoutSec: 120
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
  model-tester:
    adapter:
      type: opencode_local
      config:
        model: openrouter/openrouter/auto
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
